name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned API contract
        run: pnpm verify:contract

      - name: Generate API client and schemas
        run: pnpm codegen

      - name: Typecheck generated consumer
        run: pnpm typecheck

      - name: Test API transport and contract
        run: pnpm test:contract

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
    steps:
      - name: Trigger Coolify deploy
        if: env.COOLIFY_DEPLOY_WEBHOOK != ''
        run: curl --fail --silent --show-error --max-time 60 -X POST "$COOLIFY_DEPLOY_WEBHOOK"
      - name: Skip unconfigured deployment
        if: env.COOLIFY_DEPLOY_WEBHOOK == ''
        run: echo 'Deployment skipped because COOLIFY_DEPLOY_WEBHOOK is not configured.'
